  <text x="100" y="73" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">FC FOOTBALL</text>

  <!-- Soccer Ball -->
  <circle cx="100" cy="115" r="26" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <polygon points="100,105 108,111 105,121 95,121 92,111" fill="#0F172A"/>

  <!-- Bottom CKC FC Text -->
  <rect x="42" y="156" width="116" height="24" rx="3" fill="#0F172A"/>
  <text x="100" y="173" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">CKC FC</text>
</svg>
